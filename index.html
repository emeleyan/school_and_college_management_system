    <script>
      // Ensure window.fetch has both getter and setter so environment scripts can safely patch or intercept it
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already non-configurable
        }

        // Intercept Vite HMR WebSocket in development to prevent "WebSocket closed without opened" and unhandled rejections
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var NativeWS = window.WebSocket;

            function isViteHmr(url, protocols) {
              var u = String(url || '');
              var p = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
              return (
                p.includes('vite-hmr') ||
                p.includes('vite-ping') ||
                u.includes(':24678') ||
                (u.includes('token=') && (u.includes('/@vite/') || u.includes('vite')))
              );
            }

            function SafeViteWebSocket(url, protocols) {
              if (!isViteHmr(url, protocols)) {
                return new NativeWS(url, protocols);
              }

              // Create benign Mock WebSocket that stays in OPEN state
              var target = new EventTarget();
              target.url = String(url);
              target.protocol = Array.isArray(protocols) ? protocols[0] || 'vite-hmr' : String(protocols || 'vite-hmr');
              target.readyState = NativeWS.OPEN; // 1
              target.bufferedAmount = 0;
              target.extensions = '';
              target.binaryType = 'blob';

              target.send = function() {};
              target.close = function() {
                target.readyState = NativeWS.CLOSED;
                target.dispatchEvent(new Event('close'));
              };

              setTimeout(function() {
                if (typeof target.onopen === 'function') {
                  target.onopen(new Event('open'));
                }
                target.dispatchEvent(new Event('open'));
              }, 10);

              return target;
            }

            SafeViteWebSocket.CONNECTING = NativeWS.CONNECTING;
            SafeViteWebSocket.OPEN = NativeWS.OPEN;
            SafeViteWebSocket.CLOSING = NativeWS.CLOSING;
            SafeViteWebSocket.CLOSED = NativeWS.CLOSED;
            SafeViteWebSocket.prototype = NativeWS.prototype;

            window.WebSocket = SafeViteWebSocket;
          }
        } catch (e) {}

        // Global unhandled rejection & window error suppression for benign Vite HMR websocket drops
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('closed without opened') ||
            msg.includes('[vite]')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('closed without opened') ||
            msg.includes('[vite]')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Filter console.error from triggering UI overlay for Vite websocket disconnect
        try {
          var origErr = console.error;
          console.error = function() {
            var first = arguments[0];
            if (
              typeof first === 'string' &&
              (first.includes('[vite] failed to connect to websocket') ||
               first.includes('WebSocket closed without opened'))
            ) {
              return;
            }
            return origErr.apply(console, arguments);
          };
        } catch (e) {}

        try {
          var savedTheme = localStorage.getItem('erp_theme_pref');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
